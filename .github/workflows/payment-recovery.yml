name: Hourly payment recovery

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# No checkout or repository token is needed to invoke the protected endpoint.
permissions: {}

concurrency:
  group: payment-recovery-production
  cancel-in-progress: false

jobs:
  reconcile:
    # Enable only after the recovery backend is deployed and the secret is configured.
    if: vars.PAYMENT_RECOVERY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile pending Mercado Pago payments
        env:
          RECOVERY_SECRET: ${{ secrets.PAYMENT_RECOVERY_CRON_SECRET }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          secret = os.environ.get('RECOVERY_SECRET', '')
          if not secret:
              sys.exit('Missing PAYMENT_RECOVERY_CRON_SECRET repository secret.')

          # Never forward the credential to another host through a redirect.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          url = 'https://www.mireceta.online/api/payments/reconcile-pending?limit=100'
          for attempt in range(1, 4):
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + secret,
                  'Accept': 'application/json',
                  'User-Agent': 'MiReceta-Payment-Recovery',
              })
              try:
                  with opener.open(request, timeout=65) as response:
                      payload = json.loads(response.read(16384))
                  keys = ('checked', 'updated', 'unresolved', 'failed')
                  summary = {key: payload.get(key) for key in keys}
                  if any(type(value) is not int or not 0 <= value <= 500 for value in summary.values()):
                      sys.exit('Invalid payment recovery summary; response omitted.')
                  if summary['updated'] + summary['unresolved'] + summary['failed'] > summary['checked']:
                      sys.exit('Inconsistent payment recovery summary; response omitted.')
                  # Only counters are logged, never raw response bodies or patient data.
                  print(json.dumps(summary))
                  if summary['failed']:
                      sys.exit('Some payments could not be verified; inspect persistent recovery audit.')
                  break
              except urllib.error.HTTPError as error:
                  print('Recovery HTTP status:', error.code)
                  if error.code not in (429, 500, 502, 503, 504) or attempt == 3:
                      sys.exit('Payment recovery request failed; response omitted.')
              except (urllib.error.URLError, TimeoutError):
                  if attempt == 3:
                      sys.exit('Payment recovery network failure; details omitted.')
              except (ValueError, AttributeError):
                  sys.exit('Invalid payment recovery response; body omitted.')
              time.sleep(10 * attempt)
          PY
